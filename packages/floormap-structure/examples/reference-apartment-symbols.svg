<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 784" width="704" height="784" role="img" aria-label="Reference Apartment">
<title>Reference Apartment</title>
<style>
.background{fill:#f5f7fa}
.room{fill:#eef3f8;stroke:none}
.wall{fill:none;stroke-linecap:square;stroke-linejoin:miter}
.wall-external{stroke:#20252b;stroke-width:6}
.wall-shared{stroke:#2563eb;stroke-width:4}
.connector{fill:none;stroke-linecap:butt}
.connector-door{stroke:#16a34a;stroke-width:8}
.connector-external-door{stroke:#15803d;stroke-width:8}
.connector-open-passage{stroke:#f97316;stroke-width:8}
.room-label{font:600 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;fill:#17202a;pointer-events:none}
.boundary-label{font:9px ui-monospace,monospace;text-anchor:middle;dominant-baseline:middle;fill:#6b7280;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.architectural-symbol.selected{filter:drop-shadow(0 0 5px #f59e0b)}
.architectural-symbol:hover{filter:drop-shadow(0 0 4px #f59e0b)}
.door-symbol{pointer-events:stroke;cursor:pointer}
.door-leaf{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round}
.door-swing{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 3}
.external-door-symbol .door-leaf{stroke:#166534;stroke-width:4}
.passage-symbol{fill:none;stroke:#f59e0b;stroke-width:3;stroke-linecap:butt;stroke-dasharray:10 5;pointer-events:stroke;cursor:pointer}
.window-symbol{pointer-events:stroke;cursor:pointer}
.window-glazing{fill:none;stroke:#38bdf8;stroke-width:5;stroke-linecap:butt}
.window-frame{fill:none;stroke:#075985;stroke-width:1.5;stroke-linecap:butt}
</style>
