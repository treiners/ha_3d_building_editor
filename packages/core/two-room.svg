<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 384"><title>Two Room Example</title><style>.wall-external{stroke:black;stroke-width:6}.wall-shared{stroke:blue;stroke-width:4}.room{fill:#eef3f8}</style><polygon class="room" points="32,32 352,32 352,352 32,352" /><text class="room-label" x="32" y="32">Left Room</text>
<polygon class="room" points="352,32 672,32 672,352 352,352" /><text class="room-label" x="352" y="32">Right Room</text><line class="wall wall-external" x1="32" y1="32" x2="352" y2="32" />
<line class="wall wall-shared" x1="352" y1="32" x2="352" y2="352" />
<line class="wall wall-external" x1="352" y1="352" x2="32" y2="352" />
<line class="wall wall-external" x1="32" y1="352" x2="32" y2="32" />
<line class="wall wall-external" x1="352" y1="32" x2="672" y2="32" />
<line class="wall wall-external" x1="672" y1="32" x2="672" y2="352" />
<line class="wall wall-external" x1="672" y1="352" x2="352" y2="352" />
<line class="wall wall-shared" x1="352" y1="352" x2="352" y2="32" /><text class="boundary-label">left-b0</text>
<text class="boundary-label">left-b1</text>
<text class="boundary-label">left-b2</text>
<text class="boundary-label">left-b3</text>
<text class="boundary-label">right-b0</text>
<text class="boundary-label">right-b1</text>
<text class="boundary-label">right-b2</text>
<text class="boundary-label">right-b3</text></svg>